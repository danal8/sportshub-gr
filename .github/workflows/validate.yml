name: Validate SportsHub
on:
  push:
    branches: [main, feature/my-teams-weekly, feature/compact-matches-mobile]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node scripts/build-pages.mjs
      - name: Check published assets match tested sources
        run: git diff --exit-code -- docs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-my-teams-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-teams-ui
          path: test-artifacts/
          if-no-files-found: ignore
