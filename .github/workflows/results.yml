name: Refresh match results
on:
  push:
    branches: [main]
    paths: ['dist/*.js', 'scripts/**', '.github/workflows/results.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: sportshub-data
  cancel-in-progress: false
jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-results.mjs
      - run: node scripts/refresh-public.mjs
      - run: node scripts/volley-results.mjs
      - run: node scripts/refresh-confirmed-results.mjs
      - run: node scripts/refresh-tv-details.mjs
      - run: node scripts/refresh-highlights.mjs
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - name: Save results and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/snapshots docs/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Update published match results"
            git push
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
