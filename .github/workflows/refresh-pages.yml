name: Refresh official schedules
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sportshub-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-pages.mjs
      - run: node scripts/refresh-public.mjs
      - run: node scripts/refresh-tv-details.mjs
      - run: node scripts/cache-badges.mjs
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - name: Save verified Pages data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/snapshots dist/badges docs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified official season schedules"
            git push
          fi
      - name: Rebuild only an enabled GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.source.branch // empty' 2>/dev/null || true)
          if [ -n "$branch" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
