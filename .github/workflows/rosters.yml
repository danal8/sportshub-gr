name: Refresh season rosters
on:
  push:
    paths: ['scripts/refresh-rosters.mjs', 'scripts/roster-sources.mjs', 'scripts/enrich-roster-photos.mjs']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sportshub-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-rosters.mjs
      - run: node scripts/enrich-roster-photos.mjs
        id: photos
        continue-on-error: true
      - name: Record photo refresh coverage
        env:
          PHOTO_OUTCOME: ${{ steps.photos.outcome }}
        run: |
          node --input-type=module -e "import fs from 'node:fs';const file='dist/rosters/coverage.json',p=JSON.parse(fs.readFileSync(file));p.photoRefreshStatus=process.env.PHOTO_OUTCOME;p.photoRefreshNote=p.photoRefreshStatus==='success'?'Available source portraits matched by player ID':'Photo enrichment incomplete; existing portraits retained';fs.writeFileSync(file,JSON.stringify(p,null,2)+'\n');"
      - run: node scripts/build-pages.mjs
      - run: node --test tests/*.test.mjs
      - name: Save verified seasonal rosters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/rosters docs/rosters
          if ! git diff --cached --quiet; then
            git commit -m "Refresh season rosters and report missing coverage"
            git pull --rebase
            git push
          fi
      - name: Rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
