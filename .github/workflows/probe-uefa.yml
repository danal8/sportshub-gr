name: Verify UEFA highlight publishers
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --input-type=module <<'NODE'
          const out=[];for(const handle of ['magentasportgr','UEFA']){try{const r=await fetch('https://www.youtube.com/@'+handle,{signal:AbortSignal.timeout(15000)}),html=await r.text(),id=html.match(/"externalId":"(UC[^"]+)"/)?.[1]||html.match(/channel_id=(UC[^"&]+)/)?.[1];let entries=[];let status;if(id){const f=await fetch('https://www.youtube.com/feeds/videos.xml?channel_id='+id,{signal:AbortSignal.timeout(15000)});status=f.status;const xml=await f.text();entries=[...xml.matchAll(/<entry>([\s\S]*?)<\/entry>/g)].map(m=>m[1]);}out.push({handle,id,status,entries});}catch(e){out.push({handle,error:e.message});}}console.log('UEFA_PROBE_START');console.log(JSON.stringify(out));console.log('UEFA_PROBE_END');
          NODE
